<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#3B82F6" rx="20"/>
  
  <!-- Marketplace bag/shopping bag icon -->
  <g fill="#FFFFFF">
    <!-- Left side of bag -->
    <path d="M 25 35 L 30 55 L 30 75 Q 30 80 35 80 L 65 80 Q 70 80 70 75 L 70 55 L 75 35 Z"/>
    
    <!-- Handle -->
